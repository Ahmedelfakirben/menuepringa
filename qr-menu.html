<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Publique — QR Menu</title>
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="apple-touch-icon" href="assets/logo.jpg">
    <meta name="theme-color" content="#B28A43">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ── Reset & base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:      #F8F4EB;
            --parchment:  #EFE7D5;
            --kraft:      #B28A43;
            --kraft-dark: #8F6A2A;
            --gold:       #C29B4F;
            --gold-light: #DFC076;
            --ink:        #201C18;
            --ink-soft:   #3A342E;
            --stone:      #746B61;
        }

        body {
            background: #d6cfc4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            padding: 30px 20px;
        }

        /* ── Card principal ── */
        .card {
            background: var(--cream);
            width: 380px;
            border-radius: 28px;
            box-shadow:
                0 0 0 1px rgba(178,138,67,0.3),
                0 0 0 8px rgba(178,138,67,0.08),
                0 30px 60px -10px rgba(30,20,10,0.25),
                0 8px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        /* ── Franja superior dorada ── */
        .card-top {
            background: linear-gradient(135deg, #B28A43 0%, #7A5820 50%, #B28A43 100%);
            padding: 28px 24px 22px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card-top::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 50%, rgba(255,255,255,0.05) 0%, transparent 60%);
        }
        .card-top::after {
            content: '✦  ✦  ✦';
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 9px;
            letter-spacing: 6px;
            white-space: nowrap;
        }

        /* ── Logo ── */
        .logo-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 14px;
        }
        .logo-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #DFC076, #B28A43, #7A5820, #DFC076);
            padding: 3px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.15);
        }
        .logo-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cream);
        }

        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 3px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            position: relative;
        }
        .brand-sub {
            font-family: 'Outfit', sans-serif;
            font-size: 9.5px;
            font-weight: 400;
            color: rgba(255,255,255,0.75);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
            position: relative;
        }

        /* ── Cuerpo ── */
        .card-body {
            padding: 28px 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* Texto invitación */
        .invite-script {
            font-family: 'Alex Brush', cursive;
            font-size: 26px;
            color: var(--kraft);
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .invite-sub {
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            color: var(--stone);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        /* ── Marco QR ── */
        .qr-frame {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 16px;
            box-shadow:
                0 0 0 1px rgba(178,138,67,0.2),
                0 12px 28px -4px rgba(30,20,10,0.12);
            position: relative;
            margin-bottom: 20px;
        }
        /* Esquinas decorativas */
        .qr-frame::before,
        .qr-frame::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--kraft);
            border-style: solid;
        }
        .qr-frame::before {
            top: 6px; left: 6px;
            border-width: 2px 0 0 2px;
            border-radius: 4px 0 0 0;
        }
        .qr-frame::after {
            bottom: 6px; right: 6px;
            border-width: 0 2px 2px 0;
            border-radius: 0 0 4px 0;
        }
        .qr-frame-inner {
            position: relative;
        }
        .qr-frame-inner::before,
        .qr-frame-inner::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border-color: var(--kraft);
            border-style: solid;
        }
        .qr-frame-inner::before {
            top: -10px; right: -10px;
            border-width: 2px 2px 0 0;
            border-radius: 0 4px 0 0;
        }
        .qr-frame-inner::after {
            bottom: -10px; left: -10px;
            border-width: 0 0 2px 2px;
            border-radius: 0 0 0 4px;
        }
        .qr-frame-inner img {
            display: block;
            border-radius: 8px;
        }

        /* ── URL badge ── */
        .url-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(178,138,67,0.1), rgba(194,155,79,0.06));
            border: 1px solid rgba(178,138,67,0.25);
            border-radius: 50px;
            padding: 7px 18px;
            margin-bottom: 22px;
        }
        .url-badge svg {
            width: 13px;
            height: 13px;
            fill: var(--kraft);
            flex-shrink: 0;
        }
        .url-text {
            font-family: 'Outfit', sans-serif;
            font-size: 11.5px;
            font-weight: 500;
            color: var(--kraft-dark);
            letter-spacing: 0.5px;
        }

        /* ── Divisor ── */
        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(178,138,67,0.4), transparent);
        }
        .divider-gem {
            font-size: 10px;
            color: var(--gold);
        }

        /* ── Tagline ── */
        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 14px;
            color: var(--stone);
            text-align: center;
            line-height: 1.6;
        }

        /* ── Footer dorado ── */
        .card-footer {
            background: linear-gradient(135deg, #1a1410, #2d2218, #1a1410);
            padding: 14px 24px;
            text-align: center;
        }
        .footer-text {
            font-family: 'Cinzel', serif;
            font-size: 8.5px;
            font-weight: 500;
            color: rgba(194,155,79,0.8);
            letter-spacing: 3.5px;
            text-transform: uppercase;
        }

        /* ════════════════════════════════
           ESTILOS DE IMPRESIÓN
           ════════════════════════════════ */
        @media print {
            @page {
                size: A4;
                margin: 0;
            }
            body {
                background: white !important;
                display: block;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            /* Centrar en A4 */
            .print-page {
                width: 210mm;
                height: 297mm;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .card {
                box-shadow: none;
                border: 1px solid #c8b07a;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>

<!-- Botón imprimir (solo pantalla) -->
<button class="no-print" onclick="window.print()" style="
    position: fixed; top: 20px; right: 20px; z-index: 100;
    background: linear-gradient(135deg, #B28A43, #8F6A2A);
    color: white; border: none; border-radius: 50px;
    padding: 12px 24px; font-family: 'Outfit', sans-serif;
    font-size: 14px; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 20px rgba(142,106,42,0.4);
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 10px 28px rgba(142,106,42,0.5)'"
   onmouseout="this.style.transform=''; this.style.boxShadow='0 6px 20px rgba(142,106,42,0.4)'">
    🖨️ Imprimir / Guardar PDF
</button>

<div class="print-page">
    <div class="card">

        <!-- Franja superior -->
        <div class="card-top">
            <div class="logo-wrap">
                <div class="logo-ring">
                    <img src="assets/logo.jpg" alt="House Publique Logo">
                </div>
            </div>
            <div class="brand-name">HOUSE PUBLIQUE</div>
            <div class="brand-sub">Café &amp; Restaurant</div>
        </div>

        <!-- Cuerpo -->
        <div class="card-body">

            <div class="invite-script">Scannez pour découvrir</div>
            <div class="invite-sub">notre menu complet</div>

            <!-- QR Code via API -->
            <div class="qr-frame">
                <div class="qr-frame-inner">
                    <img
                        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https://housepublique.com/&color=201C18&bgcolor=FFFFFF&qzone=1&format=png"
                        alt="QR Code — housepublique.com"
                        width="220"
                        height="220"
                    >
                </div>
            </div>

            <!-- URL -->
            <div class="url-badge">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                <span class="url-text">housepublique.com</span>
            </div>

            <!-- Divisor -->
            <div class="divider">
                <div class="divider-line"></div>
                <div class="divider-gem">✦</div>
                <div class="divider-line"></div>
            </div>

            <!-- Tagline -->
            <p class="tagline">
                Bienvenue dans notre espace.<br>
                <em>Petit-déjeuner artistique &amp; bons moments.</em>
            </p>

        </div>

        <!-- Footer -->
        <div class="card-footer">
            <div class="footer-text">Café &nbsp;·&nbsp; Restaurant &nbsp;·&nbsp; House Publique</div>
        </div>

    </div>
</div>

</body>
</html>
