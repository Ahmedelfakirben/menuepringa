server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset correcto para el menú multilingüe (FR/ES/AR/EN)
    charset utf-8;

    # Compresión gzip para mejorar velocidad de carga
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache de imágenes (1 semana)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Página principal
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Seguridad básica: ocultar versión nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
