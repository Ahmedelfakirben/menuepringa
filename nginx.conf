server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Charset correcto para el menú multilingüe (FR/ES/AR/EN)
    charset utf-8;

    # Compresión gzip para mejorar velocidad de carga
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache de imágenes (1 semana)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Página principal y documentos HTML: forzar recarga fresca y olvidar cookies/caché
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Clear-Site-Data '"cache", "cookies", "storage"';
    }

    # Seguridad básica: ocultar versión nginx
    server_tokens off;

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
